<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f2f2f2;
}

.container{
    width:600px;
    margin:30px auto;
    background:#d9d9d9;
    padding:25px;
    border-radius:8px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input,select,textarea{
    width:100%;
    padding:8px;
    margin-top:5px;
    border:1px solid #999;
    border-radius:4px;
}

.row{
    display:flex;
    gap:10px;
}

.radio,
.checkbox{
    margin-top:10px;
}

.radio input,
.checkbox input{
    width:auto;
    margin-right:5px;
}

button{
    display:block;
    margin:20px auto;
    padding:10px 25px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:darkgreen;
}
    </style>
</head>
<body>

<div class="container">
    <h1>Student Registration Form</h1>

    <form action="priyanshipanwar348@gmail.com">

        <label>Roll No.</label>
        <input type="text">

        <label>Student Name</label>
        <div class="row">
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name">
        </div>

        <label>Father's Name</label>
        <input type="text">

        <label>Date of Birth</label>
        <div class="row">
            <select>
                <option>Day</option>
            </select>

            <select>
                <option>Month</option>
            </select>

            <select>
                <option>Year</option>
            </select>
        </div>

        <label>Mobile No.</label>
        <div class="row">
            <input type="text" value="+91" style="width:70px;">
            <input type="text">
        </div>

        <label>Email ID</label>
        <input type="email">

        <label>Password</label>
        <input type="password">

        <label>Gender</label>
        <div class="radio">
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
        </div>

        <label>Department</label>
        <div class="checkbox">
            <input type="checkbox"> CSE
            <input type="checkbox"> IT
            <input type="checkbox"> ECE
            <input type="checkbox"> Civil
            <input type="checkbox"> Mech
        </div>

        <label>Course</label>
        <select>
            <option>Select Current Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
        </select>

        <label>Student Photo</label>
        <input type="file">

        <label>City</label>
        <input type="text">

        <label>Address</label>
        <textarea rows="5"></textarea>

        <button type="submit">Register</button>

    </form>
</div>

</body>
</html>
